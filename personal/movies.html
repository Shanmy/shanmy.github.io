<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seattle Movie Calendar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #f5f5f3;
      --card:   #ffffff;
      --text:   #1a1a1a;
      --muted:  #6b6b6b;
      --faint:  #9a9a9a;
      --border: #e2e2e0;
      --chip:   #f2f2f0;
      --accent: #2c2c2c;
      --oc:     #b45309;
      --oc-bg:  #fdf1e1;
      --sub:    #1d5fb8;
      --sub-bg: #e5eefb;
      --warn:   #b83232;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #161616;
        --card:   #202020;
        --text:   #ececec;
        --muted:  #a3a3a3;
        --faint:  #777;
        --border: #333;
        --chip:   #2a2a2a;
        --accent: #ececec;
        --oc:     #f0a54a;
        --oc-bg:  #3a2a14;
        --sub:    #7fb0f0;
        --sub-bg: #1b2a40;
        --warn:   #f08080;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.5;
    }
    a { color: inherit; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }

    /* ── Header ── */
    .header { border-bottom: 2px solid var(--border); padding-bottom: 14px; margin-bottom: 16px; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .header h1 { font-size: 22px; font-weight: 650; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .sources { margin-top: 8px; font-size: 12px; color: var(--faint); }
    .sources .bad { color: var(--warn); }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }

    /* ── Controls ── */
    .days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
    .day {
      flex: 0 0 auto; border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 10px; padding: 6px 12px; cursor: pointer; text-align: center; font-size: 13px;
    }
    .day small { display: block; font-size: 11px; color: var(--muted); }
    .day.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .day.active small { color: var(--bg); opacity: .8; }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .seg { display: inline-flex; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
    .seg button {
      border: 0; background: var(--card); color: var(--text); padding: 5px 12px;
      font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button.active { background: var(--accent); color: var(--bg); }
    .seg button.active.oc  { background: var(--oc); color: #fff; }
    .seg button.active.sub { background: var(--sub); color: #fff; }
    #ui-lang button { padding: 3px 10px; font-size: 12px; }

    select, input[type=search] {
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 20px; padding: 5px 12px; font-size: 13px; outline: none;
    }
    select { max-width: 100%; }
    input[type=search] { flex: 1 1 180px; min-width: 0; }
    .areas { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .areas label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }

    .summary { font-size: 12px; color: var(--faint); margin: 6px 0 12px; }

    /* ── Cards ── */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; display: flex; gap: 12px;
    }
    .poster { width: 54px; flex: 0 0 54px; border-radius: 4px; object-fit: cover; align-self: flex-start; background: var(--chip); }
    .card-body { flex: 1; min-width: 0; }
    .title { font-size: 15px; font-weight: 600; }
    .title a { text-decoration: none; }
    .title a:hover { text-decoration: underline; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .lang { font-weight: 500; color: var(--text); }
    .lang .q, .q { color: var(--faint); font-weight: 400; }

    .row { display: flex; gap: 10px; margin-top: 8px; align-items: baseline; }
    .row-name { flex: 0 0 190px; font-size: 13px; }
    .row-name a { text-decoration: none; }
    .row-name a:hover { text-decoration: underline; }
    .row-name small { display: block; color: var(--faint); font-size: 11px; }
    .times { display: flex; flex-wrap: wrap; gap: 5px; }

    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--chip); border: 1px solid transparent; border-radius: 6px;
      padding: 2px 7px; font-size: 12.5px; font-variant-numeric: tabular-nums;
      text-decoration: none; white-space: nowrap;
    }
    a.chip:hover { border-color: var(--faint); }
    .chip.past { opacity: .4; }
    .chip.oc  { background: var(--oc-bg);  border-color: var(--oc); }
    .chip.sub { background: var(--sub-bg); border-color: var(--sub); }
    .chip.subq { background: var(--sub-bg); border-style: dashed; border-color: var(--sub); }
    .chip .tag { font-size: 10px; color: var(--muted); }
    .badge {
      font-size: 10px; font-weight: 700; letter-spacing: .03em; border-radius: 3px; padding: 0 4px; color: #fff;
    }
    .badge.oc  { background: var(--oc); }
    .badge.sub { background: var(--sub); }
    .badge.subq { background: transparent; color: var(--sub); border: 1px dashed var(--sub); }
    .chip-note { font-size: 11px; color: var(--muted); }

    .empty { text-align: center; color: var(--muted); padding: 50px 0; }

    @media (max-width: 640px) {
      .row { flex-direction: column; gap: 4px; }
      .row-name { flex: none; }
      .poster { display: none; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-top">
      <h1 data-i18n="title"></h1>
      <div class="seg" id="ui-lang">
        <button data-v="en">EN</button>
        <button data-v="zh">中文</button>
      </div>
    </div>
    <div class="subtitle"><span data-i18n="subtitle"></span> <span id="updated"></span></div>
    <div class="legend">
      <span><span class="badge oc" data-i18n="badge_oc"></span> <span data-i18n="legend_oc"></span></span>
      <span><span class="badge sub" data-i18n="badge_sub"></span> <span data-i18n="legend_sub"></span></span>
      <span><span class="badge subq" data-i18n="badge_subq"></span> <span data-i18n="legend_subq"></span></span>
    </div>
    <div class="sources" id="sources"></div>
  </div>

  <div class="days" id="days"></div>

  <div class="controls">
    <div class="seg" id="cap-seg">
      <button data-v="all" data-i18n="all"></button>
      <button data-v="any" class="oc" data-i18n="cap_any"></button>
      <button data-v="oc" class="oc" data-i18n="cap_oc"></button>
      <button data-v="sub" class="sub" data-i18n="cap_sub"></button>
    </div>
    <div class="seg" id="view-seg">
      <button data-v="film" data-i18n="by_film"></button>
      <button data-v="theater" data-i18n="by_theater"></button>
    </div>
    <div class="seg" id="kind-seg">
      <button data-v="all" data-i18n="all"></button>
      <button data-v="independent" data-i18n="indie"></button>
      <button data-v="chain" data-i18n="chains"></button>
    </div>
  </div>
  <div class="controls">
    <select id="lang-sel"></select>
    <select id="th-sel"></select>
    <input type="search" id="search" data-i18n-ph="search">
  </div>
  <div class="controls areas" id="areas"></div>

  <div class="summary" id="summary"></div>
  <div class="list" id="list"><div class="empty" data-i18n="loading"></div></div>
</div>

<script>
const AREAS = ["Seattle", "Eastside", "North", "South", "Kitsap", "Other"];
const STORE = "movie-cal-prefs";

const I18N = {
  en: {
    title: "Seattle Movie Calendar",
    subtitle: "Showtimes for the next 7 days at commercial and independent cinemas in Seattle and nearby cities. Refreshed every morning.",
    updated: d => `Last updated ${d} (Seattle time).`,
    badge_oc: "OC", badge_sub: "EN SUB", badge_subq: "EN SUB?",
    legend_oc: "English open caption",
    legend_sub: "Non-English, English subtitles",
    legend_subq: "Non-English, subtitles likely but not stated",
    sources: "Sources", failed: "failed",
    all: "All", cap_any: "Captioned", cap_oc: "OC", cap_sub: "EN subs",
    by_film: "By film", by_theater: "By theater", indie: "Indie", chains: "Chains",
    all_langs: "All languages", all_theaters: "All theaters", search: "Search film…",
    loading: "Loading…", none: "No showtimes match these filters.",
    load_err: e => `Could not load showtimes (${e}).`,
    today: "Today", min: m => `${m} min`, indie_short: "indie", independent: "independent",
    lang_na: "language n/a", subs: l => `${l} subs`, unknown: "Unknown",
    guess: src => `Language from ${src === "wikidata" ? "Wikidata" : "default"}, not from the cinema`,
    summary: (d, n, unit, s) => `${d} · ${n} ${unit} · ${s} showtimes`,
    films: "films", theaters: "theaters",
    areas: { Seattle: "Seattle", Eastside: "Eastside", North: "North", South: "South", Kitsap: "Kitsap", Other: "Other" },
    langs: {},
  },
  zh: {
    title: "西雅图电影日历",
    subtitle: "西雅图及周边城市商业影院与独立影院未来 7 天的排片，每天早上自动更新。",
    updated: d => `最近更新：${d}（西雅图时间）。`,
    badge_oc: "OC", badge_sub: "英字", badge_subq: "英字?",
    legend_oc: "英语开放字幕（open caption）",
    legend_sub: "非英语影片，带英文字幕",
    legend_subq: "非英语影片，影院未注明字幕（多半有英文字幕）",
    sources: "数据来源", failed: "抓取失败",
    all: "全部", cap_any: "有字幕", cap_oc: "开放字幕", cap_sub: "英文字幕",
    by_film: "按电影", by_theater: "按影院", indie: "独立影院", chains: "院线",
    all_langs: "全部语言", all_theaters: "全部影院", search: "搜索电影…",
    loading: "加载中…", none: "没有符合筛选条件的场次。",
    load_err: e => `排片加载失败（${e}）。`,
    today: "今天", min: m => `${m} 分钟`, indie_short: "独立", independent: "独立影院",
    lang_na: "语言未知", subs: l => `${l}字幕`, unknown: "未知",
    guess: src => `语言来自${src === "wikidata" ? " Wikidata" : "默认推断"}，非影院标注`,
    summary: (d, n, unit, s) => `${d} · ${n} ${unit} · ${s} 个场次`,
    films: "部电影", theaters: "家影院",
    areas: { Seattle: "西雅图", Eastside: "东区", North: "北区", South: "南区", Kitsap: "基察普", Other: "其他" },
    langs: {
      English: "英语", Spanish: "西班牙语", French: "法语", German: "德语", Italian: "意大利语",
      Portuguese: "葡萄牙语", Russian: "俄语", Polish: "波兰语", Czech: "捷克语", Hungarian: "匈牙利语",
      Romanian: "罗马尼亚语", Greek: "希腊语", Turkish: "土耳其语", Dutch: "荷兰语", Swedish: "瑞典语",
      Danish: "丹麦语", Norwegian: "挪威语", Finnish: "芬兰语", Icelandic: "冰岛语", Ukrainian: "乌克兰语",
      Serbian: "塞尔维亚语", Croatian: "克罗地亚语", Georgian: "格鲁吉亚语", Armenian: "亚美尼亚语",
      Persian: "波斯语", Farsi: "波斯语", Arabic: "阿拉伯语", Hebrew: "希伯来语", Hindi: "印地语",
      Tamil: "泰米尔语", Telugu: "泰卢固语", Malayalam: "马拉雅拉姆语", Kannada: "卡纳达语",
      Punjabi: "旁遮普语", Bengali: "孟加拉语", Marathi: "马拉地语", Gujarati: "古吉拉特语", Urdu: "乌尔都语",
      Nepali: "尼泊尔语", Mandarin: "普通话", Cantonese: "粤语", Chinese: "中文", Japanese: "日语",
      Korean: "韩语", Thai: "泰语", Vietnamese: "越南语", Tagalog: "他加禄语", Filipino: "菲律宾语",
      Indonesian: "印尼语", Malay: "马来语", Khmer: "高棉语", Mongolian: "蒙古语", Tibetan: "藏语",
      Silent: "默片", Unknown: "未知",
    },
  },
};

let DATA = null;
let state = { ui: "en", day: null, cap: "all", view: "film", kind: "all", lang: "", th: "", q: "", areas: ["Seattle", "Eastside", "North", "South"] };

try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}"), { day: null, q: "" }); } catch (e) {}
const urlLang = new URLSearchParams(location.search).get("lang");
if (urlLang === "zh" || urlLang === "en") state.ui = urlLang;
if (!I18N[state.ui]) state.ui = "en";

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ ui: state.ui, cap: state.cap, view: state.view, kind: state.kind, areas: state.areas, lang: state.lang })); } catch (e) {}
}

const L = () => I18N[state.ui];
const locale = () => state.ui === "zh" ? "zh-CN" : "en-US";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// "Tamil / Telugu" → "泰米尔语 / 泰卢固语"
const langName = l => String(l).split(" / ").map(x => L().langs[x] || x).join(" / ");

function fmtTime(iso) {
  let [h, m] = iso.slice(11, 16).split(":").map(Number);
  if (state.ui === "zh") return iso.slice(11, 16);
  const ap = h >= 12 ? "p" : "a";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")}${ap}`;
}
function nowLocal() {
  // current Seattle wall-clock time as "YYYY-MM-DDTHH:MM"
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return `${g("year")}-${g("month")}-${g("day")}T${g("hour")}:${g("minute")}`;
}

function capClass(s) {
  return s.cap === "oc" ? "oc" : s.cap === "en_subs" ? "sub" : s.cap === "en_subs?" ? "subq" : "";
}
function capBadge(s) {
  return s.cap === "oc" ? `<span class="badge oc">${L().badge_oc}</span>`
    : s.cap === "en_subs" ? `<span class="badge sub">${L().badge_sub}</span>`
    : s.cap === "en_subs?" ? `<span class="badge subq">${L().badge_subq}</span>` : "";
}

function matches(s) {
  const th = DATA.theaters[s.th];
  if (!s.start.startsWith(state.day)) return false;
  if (!state.areas.includes(th.area)) return false;
  if (state.kind !== "all" && th.kind !== state.kind) return false;
  if (state.th && s.th !== state.th) return false;
  if (state.lang && (s.lang || "Unknown") !== state.lang) return false;
  if (state.cap === "oc" && s.cap !== "oc") return false;
  if (state.cap === "sub" && !(s.cap === "en_subs" || s.cap === "en_subs?")) return false;
  if (state.cap === "any" && !s.cap) return false;
  return true;
}

function chip(s, now, label) {
  const past = s.start < now ? " past" : "";
  const tags = (s.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const inner = `${label}${capBadge(s)}${tags}${s.note ? `<span class="chip-note">${esc(s.note)}</span>` : ""}`;
  const title = [s.lang && langName(s.lang), (s.subs || []).length ? L().subs(s.subs.map(langName).join("/")) : ""].filter(Boolean).join(" · ");
  return s.url
    ? `<a class="chip ${capClass(s)}${past}" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(title)}">${inner}</a>`
    : `<span class="chip ${capClass(s)}${past}" title="${esc(title)}">${inner}</span>`;
}

function theaterName(id) {
  const t = DATA.theaters[id];
  return `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a><small>${esc(t.city)}${t.kind === "independent" ? " · " + L().indie_short : ""}</small>`;
}

function filmMeta(f, shown) {
  const langs = [...new Set(shown.map(s => s.lang).filter(Boolean))];
  const lang = langs.length ? langs.map(l => esc(langName(l))).join(" / ") : `<span class="q">${L().lang_na}</span>`;
  const guess = f.lang_src === "assumed" || f.lang_src === "wikidata" ? ` <span class="q" title="${esc(L().guess(f.lang_src))}">*</span>` : "";
  return [`<span class="lang">${lang}${guess}</span>`, f.year, f.runtime ? L().min(f.runtime) : ""].filter(Boolean).join(" · ");
}

function byTheaterOrder(a, b) {
  const ta = DATA.theaters[a], tb = DATA.theaters[b];
  return AREAS.indexOf(ta.area) - AREAS.indexOf(tb.area) || ta.name.localeCompare(tb.name);
}

function render() {
  const now = nowLocal();
  const q = state.q.trim().toLowerCase();
  const list = document.getElementById("list");
  let html = "", nShows = 0, nCards = 0;

  if (state.view === "film") {
    for (const f of DATA.films) {
      if (q && !f.title.toLowerCase().includes(q)) continue;
      const shown = f.screenings.filter(matches);
      if (!shown.length) continue;
      nCards++; nShows += shown.length;
      const byTh = new Map();
      for (const s of shown) (byTh.get(s.th) || byTh.set(s.th, []).get(s.th)).push(s);
      const rows = [...byTh.entries()].sort((a, b) => byTheaterOrder(a[0], b[0]))
        .map(([th, ss]) => `<div class="row"><div class="row-name">${theaterName(th)}</div>
          <div class="times">${ss.map(s => chip(s, now, fmtTime(s.start))).join("")}</div></div>`).join("");
      const poster = f.poster ? `<img class="poster" src="${esc(f.poster)}" alt="" loading="lazy">` : "";
      const title = f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : esc(f.title);
      html += `<div class="card">${poster}<div class="card-body">
        <div class="title">${title}</div><div class="meta">${filmMeta(f, shown)}</div>${rows}</div></div>`;
    }
  } else {
    const byTh = new Map();
    for (const f of DATA.films) {
      if (q && !f.title.toLowerCase().includes(q)) continue;
      for (const s of f.screenings) {
        if (!matches(s)) continue;
        nShows++;
        const m = byTh.get(s.th) || byTh.set(s.th, new Map()).get(s.th);
        (m.get(f) || m.set(f, []).get(f)).push(s);
      }
    }
    for (const id of [...byTh.keys()].sort(byTheaterOrder)) {
      const t = DATA.theaters[id];
      nCards++;
      const rows = [...byTh.get(id).entries()].sort((a, b) => a[1][0].start.localeCompare(b[1][0].start))
        .map(([f, ss]) => {
          const title = f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : esc(f.title);
          return `<div class="row"><div class="row-name">${title}<small>${filmMeta(f, ss)}</small></div>
            <div class="times">${ss.map(s => chip(s, now, fmtTime(s.start))).join("")}</div></div>`;
        }).join("");
      html += `<div class="card"><div class="card-body">
        <div class="title"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a></div>
        <div class="meta">${esc([t.address, t.city].filter(Boolean).join(", "))}${t.kind === "independent" ? " · " + L().independent : ""}</div>
        ${rows}</div></div>`;
    }
  }

  list.innerHTML = html || `<div class="empty">${L().none}</div>`;
  const d = new Date(state.day + "T12:00").toLocaleDateString(locale(), { weekday: "long", month: "short", day: "numeric" });
  document.getElementById("summary").textContent =
    L().summary(d, nCards, state.view === "film" ? L().films : L().theaters, nShows);
}

function setupSeg(id, key, onChange) {
  const el = document.getElementById(id);
  el.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.v === state[key]);
    b.onclick = () => {
      state[key] = b.dataset.v;
      el.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
      save(); (onChange || render)();
    };
  });
}

// Static text, dropdowns, day tabs, area checkboxes — everything that depends on UI language.
function applyLang() {
  document.documentElement.lang = state.ui === "zh" ? "zh-CN" : "en";
  document.title = L().title;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L()[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = L()[el.dataset.i18nPh]; });
  if (!DATA) return;

  const gen = new Date(DATA.generated_at).toLocaleString(locale(),
    { timeZone: "America/Los_Angeles", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  document.getElementById("updated").textContent = L().updated(gen);
  document.getElementById("sources").innerHTML = L().sources + ": " + Object.entries(DATA.sources)
    .map(([k, v]) => v.ok ? `${esc(k)} (${v.count})` : `<span class="bad" title="${esc(v.error)}">${esc(k)}: ${L().failed}</span>`).join(" · ");

  // Day tabs
  const today = nowLocal().slice(0, 10);
  const days = DATA.days.filter(d => d >= today);
  if (!days.length) days.push(...DATA.days);
  if (!days.includes(state.day)) state.day = days[0];
  const dayEl = document.getElementById("days");
  dayEl.innerHTML = days.map(d => {
    const dt = new Date(d + "T12:00");
    const top = d === today ? L().today : dt.toLocaleDateString(locale(), { weekday: "short" });
    return `<button class="day" data-d="${d}">${top}<small>${dt.toLocaleDateString(locale(), { month: "short", day: "numeric" })}</small></button>`;
  }).join("");
  dayEl.querySelectorAll(".day").forEach(b => {
    b.classList.toggle("active", b.dataset.d === state.day);
    b.onclick = () => {
      state.day = b.dataset.d;
      dayEl.querySelectorAll(".day").forEach(x => x.classList.toggle("active", x === b));
      render();
    };
  });

  // Languages, most screenings first
  const counts = {};
  DATA.films.forEach(f => f.screenings.forEach(s => { const l = s.lang || "Unknown"; counts[l] = (counts[l] || 0) + 1; }));
  const langSel = document.getElementById("lang-sel");
  langSel.innerHTML = "";
  langSel.add(new Option(L().all_langs, ""));
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([l]) => langSel.add(new Option(langName(l), l)));
  if (!counts[state.lang]) state.lang = "";
  langSel.value = state.lang;
  langSel.onchange = () => { state.lang = langSel.value; save(); render(); };

  const thSel = document.getElementById("th-sel");
  thSel.innerHTML = "";
  thSel.add(new Option(L().all_theaters, ""));
  Object.keys(DATA.theaters).sort(byTheaterOrder)
    .forEach(id => thSel.add(new Option(`${DATA.theaters[id].name} (${DATA.theaters[id].city})`, id)));
  thSel.value = state.th;
  thSel.onchange = () => { state.th = thSel.value; render(); };

  const present = new Set(Object.values(DATA.theaters).map(t => t.area));
  const areaEl = document.getElementById("areas");
  areaEl.innerHTML = AREAS.filter(a => present.has(a)).map(a =>
    `<label><input type="checkbox" value="${a}" ${state.areas.includes(a) ? "checked" : ""}> ${L().areas[a]}</label>`).join("");
  areaEl.querySelectorAll("input").forEach(cb => cb.onchange = () => {
    state.areas = [...areaEl.querySelectorAll("input:checked")].map(x => x.value);
    save(); render();
  });

  render();
}

function init(data) {
  DATA = data;
  const search = document.getElementById("search");
  search.oninput = () => { state.q = search.value; render(); };
  setupSeg("cap-seg", "cap");
  setupSeg("view-seg", "view");
  setupSeg("kind-seg", "kind");
  applyLang();
}

setupSeg("ui-lang", "ui", applyLang);
applyLang();

fetch("movies/latest.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(init)
  .catch(e => { document.getElementById("list").innerHTML = `<div class="empty">${esc(L().load_err(e.message))}</div>`; });
</script>
</body>
</html>
