<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>说书人助手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;--card:#1a1a2e;--card2:#151528;--border:rgba(255,255,255,.06);
  --accent:#7c4dff;--cyan:#4fc3f7;--amber:#ffa726;--green:#66bb6a;--red:#ef5350;
  --txt:#e8e8f0;--txt2:#6878a0;
  --towns:#42a5f5;--out:#26c6da;--minion:#ef5350;--demon:#ff1744;--traveler:#ce93d8;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;-webkit-tap-highlight-color:transparent;}
.hidden{display:none!important}

/* ── BUTTONS ── */
.btn{display:block;width:100%;padding:15px 20px;border:none;border-radius:14px;
  font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;
  -webkit-appearance:none;}
.btn:active{opacity:.82;transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--card2);color:var(--txt)}
.btn-night{background:rgba(124,77,255,.18);color:var(--cyan);border:1px solid rgba(124,77,255,.5)}
.btn-day{background:rgba(255,167,38,.12);color:var(--amber);border:1px solid rgba(255,167,38,.4)}

/* ── TEAM TAGS ── */
.tt{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.4px}
.tt-townsfolk{background:#1a3a5c;color:var(--towns)}
.tt-outsider{background:#0a3040;color:var(--out)}
.tt-minion{background:#3a1a1a;color:var(--minion)}
.tt-demon{background:#2a0505;color:var(--demon)}
.tt-traveler{background:#2a1540;color:var(--traveler)}

/* ══════════════════════════════════════
   SCREEN: UPLOAD
══════════════════════════════════════ */
#screen-upload{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:48px 24px;text-align:center;gap:6px}
.up-moon{font-size:72px;margin-bottom:8px}
.up-title{font-size:26px;font-weight:800;color:var(--cyan)}
.up-sub{font-size:14px;color:var(--txt2);margin-bottom:32px}
.up-drop{width:100%;max-width:320px;border:2px dashed #333;border-radius:20px;
  padding:40px 20px;cursor:pointer;transition:border-color .2s}
.up-drop:active,.up-drop.drag{border-color:var(--accent)}
.up-drop-icon{font-size:40px;margin-bottom:10px}
.up-drop-lbl{font-size:14px;color:var(--txt2)}
.up-hint{font-size:12px;color:var(--txt2);margin-top:16px;opacity:.6}
.up-or{font-size:13px;color:var(--txt2);margin:14px 0 10px}
.up-load-btn{display:inline-block;padding:11px 24px;border-radius:12px;border:1px solid #333;
  color:var(--txt2);font-size:14px;cursor:pointer;transition:border-color .2s,color .2s}
.up-load-btn:active{border-color:var(--accent);color:var(--txt)}
.up-default{display:flex;align-items:center;gap:12px;width:100%;max-width:320px;
  background:var(--card);border:1.5px solid var(--accent);border-radius:16px;
  padding:14px 16px;cursor:pointer;text-align:left;transition:background .15s;
  margin-bottom:4px;-webkit-appearance:none;color:var(--txt)}
.up-default:active{background:rgba(124,77,255,.18)}
.up-default-logo{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#252540;flex-shrink:0}
.up-default-info{flex:1;min-width:0}
.up-default-name{font-size:17px;font-weight:700}
.up-default-by{font-size:11px;color:var(--txt2);margin-top:2px}
.up-default-arr{color:var(--accent);font-size:18px;flex-shrink:0}
input[type=file]{display:none}

/* ══════════════════════════════════════
   SCREEN: COUNT
══════════════════════════════════════ */
#screen-count{padding:32px 20px 48px;display:flex;flex-direction:column;align-items:center}
.scr-top{width:100%;max-width:400px;margin-bottom:28px}
.scr-game{font-size:22px;font-weight:800;color:var(--cyan)}
.scr-sub{font-size:14px;color:var(--txt2);margin-top:4px}
.cnt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  width:100%;max-width:400px;margin-bottom:28px}
.cnt-btn{aspect-ratio:1;background:var(--card);border:2px solid transparent;
  border-radius:12px;color:var(--txt);font-size:20px;font-weight:700;cursor:pointer;transition:all .15s}
.cnt-btn.sel{border-color:var(--accent);color:var(--accent);background:rgba(124,77,255,.1)}

/* ══════════════════════════════════════
   SCREEN: ROLES
══════════════════════════════════════ */
#screen-roles{padding:20px 16px 64px}
.roles-top{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.roles-top-left .scr-game{font-size:20px}
.roles-back{background:none;border:none;color:var(--txt2);font-size:13px;cursor:pointer;padding:6px 10px;
  border-radius:8px;border:1px solid #333}
.roles-adj-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--accent);
  background:transparent;color:var(--accent);font-size:22px;cursor:pointer;line-height:1;
  transition:background .15s;-webkit-appearance:none;appearance:none}
.roles-adj-btn:active{background:rgba(124,77,255,.18)}
.roles-adj-btn:disabled{opacity:.3;pointer-events:none}

.pslot{background:var(--card);border-radius:14px;padding:12px 12px;
  margin-bottom:8px;display:flex;align-items:center;gap:8px}
.seat-dot{min-width:28px;height:28px;border-radius:50%;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--txt2)}
.pname-in{flex:1;min-width:0;background:transparent;border:none;
  border-bottom:1px solid #2a2a4a;color:var(--txt);font-size:14px;padding:3px 0;outline:none}
.pname-in::placeholder{color:var(--txt2)}

.pick-btn{display:flex;align-items:center;gap:5px;background:var(--card2);
  border:none;border-radius:10px;padding:6px 8px;cursor:pointer;max-width:140px;flex-shrink:0}
.pick-btn-img{width:24px;height:24px;border-radius:6px;object-fit:cover;background:#333;flex-shrink:0}
.pick-btn-name{font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:60px}
.pick-btn-name.ph{color:var(--txt2)}

/* ══════════════════════════════════════
   SCREEN: NIGHT
══════════════════════════════════════ */
#screen-night{display:flex;flex-direction:column;min-height:100vh}
.night-hdr{position:sticky;top:0;z-index:10;background:rgba(13,13,26,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.night-hdr-l{display:flex;align-items:center;gap:8px}
.night-num-badge{padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;
  background:rgba(79,195,247,.1);color:var(--cyan)}
.night-step-ct{font-size:13px;color:var(--txt2)}
.night-body{flex:1;overflow-y:auto;padding:14px 14px 32px}

/* intro card */
.intro-card{background:var(--card);border-radius:20px;padding:24px 20px;margin-bottom:12px;text-align:center}
.intro-icon{font-size:52px;margin-bottom:10px}
.intro-title{font-size:20px;font-weight:800;margin-bottom:6px}
.intro-text{font-size:13px;color:var(--txt2);line-height:1.7}
.intro-count{font-size:15px;color:var(--cyan);font-weight:700;margin-top:8px}

/* night order preview */
.nop-card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px}
.nop-hdr{padding:10px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--txt2);border-bottom:1px solid var(--border)}
.nop-row{display:flex;align-items:center;padding:9px 14px;gap:8px;border-bottom:1px solid var(--border)}
.nop-row:last-child{border-bottom:none}
.nop-num{font-size:11px;color:var(--txt2);min-width:18px}
.nop-img{width:26px;height:26px;border-radius:6px;object-fit:cover;background:#333;flex-shrink:0}
.nop-name{font-size:13px;font-weight:600;flex:1}
.nop-player{font-size:11px;color:var(--txt2)}

/* character card */
.char-card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:12px}
.char-card-hero{padding:20px;display:flex;gap:14px;align-items:flex-start}
.char-hero-img{width:76px;height:76px;border-radius:16px;object-fit:cover;background:#252540;flex-shrink:0}
.char-hero-right{flex:1;min-width:0}
.char-hero-name{font-size:22px;font-weight:800;margin-bottom:5px}
.char-hero-player{font-size:13px;color:var(--cyan);margin-top:6px;display:flex;align-items:center;gap:4px}

.char-reminder{padding:14px 20px;border-top:1px solid var(--border)}
.rem-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);margin-bottom:7px}
.rem-txt{font-size:15px;line-height:1.8;color:var(--txt)}

/* evil team info */
.evil-row{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.evil-lbl{font-size:11px;font-weight:700;min-width:28px;padding-top:3px;flex-shrink:0}
.evil-val{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.evil-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);
  border-radius:8px;padding:3px 8px;font-size:13px}.evil-char{font-size:10px;color:var(--txt2)}

/* bluff picker */
.bluff-count-row{padding:2px 14px 4px;display:flex;align-items:center;gap:6px}
.bluff-count{font-size:12px;font-weight:700;color:var(--demon)}
.bluff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 14px 14px}
.bluff-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
  border-radius:10px;border:1.5px solid transparent;cursor:pointer;background:var(--card2);
  transition:all .15s;text-align:center}
.bluff-item.sel{border-color:var(--demon);background:rgba(255,23,68,.09)}
.bluff-item.bluff-full{opacity:.28;pointer-events:none}
.bluff-item-img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#252540;flex-shrink:0}
.bluff-item-name{font-size:10px;line-height:1.3;word-break:break-all}

/* navigation */
.night-nav{display:flex;gap:10px;margin-bottom:14px}
.night-nav .btn{margin:0}

/* player list */
.plist{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px}
.plist-hdr{padding:9px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--txt2);border-bottom:1px solid var(--border)}
.prow{display:flex;align-items:center;padding:10px 12px;gap:9px;
  border-bottom:1px solid var(--border);transition:opacity .2s}
.prow:last-child{border-bottom:none}
.prow.dead{opacity:.3}
.prow-img{width:32px;height:32px;border-radius:8px;object-fit:cover;background:#252540;flex-shrink:0}
.prow-info{flex:1;min-width:0}
.prow-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-char{font-size:11px;color:var(--txt2);margin-top:1px}
.kill-btn{padding:5px 11px;border:1.5px solid var(--red);border-radius:8px;
  background:transparent;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.kill-btn.exec{border-color:var(--amber);color:var(--amber)}
.dead-mark{font-size:20px;flex-shrink:0}

/* ── NOTE INPUTS ── */
.note-section{padding:4px 20px 18px;border-top:1px solid var(--border)}
.note-item{margin-top:12px}
.note-lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;
  font-weight:700;margin-bottom:5px}
.note-lbl.from{color:#a78bfa}
.note-lbl.to{color:var(--cyan)}
.note-ta{width:100%;background:var(--card2);border:1.5px solid #2a2a4a;border-radius:10px;
  color:var(--txt);font-size:14px;padding:10px 12px;resize:none;outline:none;
  font-family:inherit;min-height:60px;line-height:1.6;-webkit-appearance:none;display:block}
.note-ta:focus{border-color:var(--accent)}
.note-ta::placeholder{color:var(--txt2)}
.no-choice-lbl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2);
  cursor:pointer;user-select:none;flex-shrink:0}
.no-choice-lbl input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.no-choice-ph{font-size:13px;color:var(--txt2);font-style:italic;padding:8px 12px;
  background:var(--card2);border-radius:10px;border:1.5px dashed #2a2a4a}

/* ── NIGHT SUMMARY ── */
#screen-night-summary{padding:20px 16px 64px}
.sum-hdr{margin-bottom:20px}
.sum-badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;
  font-weight:700;background:rgba(124,77,255,.12);color:var(--accent);margin-bottom:6px}
.sum-title{font-size:22px;font-weight:800}
.sum-sub{font-size:13px;color:var(--txt2);margin-top:4px;line-height:1.5}
.sum-card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:10px}
.sum-card-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border)}
.sum-card-img{width:36px;height:36px;border-radius:9px;object-fit:cover;background:#252540;flex-shrink:0}
.sum-card-info{flex:1;min-width:0}
.sum-card-name{font-size:14px;font-weight:700}
.sum-card-player{font-size:11px;color:var(--txt2);margin-top:2px}
.sum-notes{padding:10px 14px 14px}
.sum-row{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.sum-arrow{font-size:13px;flex-shrink:0;padding-top:1px;width:16px}
.sum-row-body{flex:1;min-width:0}
.sum-row-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:2px}
.sum-row-lbl.from{color:#a78bfa}
.sum-row-lbl.to{color:var(--cyan)}
.sum-row-val{font-size:14px;line-height:1.6;color:var(--txt);white-space:pre-wrap;word-break:break-word}
.sum-empty{font-size:13px;color:var(--txt2);font-style:italic;text-align:center;padding:6px 0 2px}

/* ══════════════════════════════════════
   SCREEN: DAY
══════════════════════════════════════ */
#screen-day{padding:20px 16px 64px}
.day-hdr{margin-bottom:22px}
.day-badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;
  font-weight:700;background:rgba(255,167,38,.1);color:var(--amber);margin-bottom:6px}
.day-title{font-size:22px;font-weight:800}
.day-sub{font-size:13px;color:var(--txt2);margin-top:4px}

/* ══════════════════════════════════════
   SCREEN: GAMEOVER
══════════════════════════════════════ */
#screen-gameover{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:48px 24px;text-align:center}
.go-icon{font-size:80px;margin-bottom:18px}
.go-title{font-size:28px;font-weight:800;margin-bottom:10px}
.go-msg{font-size:16px;color:var(--txt2);margin-bottom:32px;line-height:1.7;max-width:320px}

/* ══════════════════════════════════════
   SCREEN: REVIEW
══════════════════════════════════════ */
#screen-review{padding:20px 16px 64px}
.rv-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.rv-back{background:none;border:1px solid #333;border-radius:8px;color:var(--txt2);
  font-size:13px;cursor:pointer;padding:6px 10px;flex-shrink:0}
.rv-title{font-size:22px;font-weight:800}
.rv-sub{font-size:13px;color:var(--txt2);margin-top:2px}
.rv-sec-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);
  padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:10px;margin-top:6px}
.rv-role-row{display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--card);border-radius:10px;margin-bottom:6px;transition:opacity .2s}
.rv-role-seat{font-size:12px;color:var(--txt2);min-width:22px;text-align:center}
.rv-role-img{width:28px;height:28px;border-radius:7px;object-fit:cover;background:#252540;flex-shrink:0}
.rv-role-info{flex:1;min-width:0}
.rv-role-name{font-size:14px;font-weight:600}
.rv-role-meta{font-size:11px;color:var(--txt2);margin-top:1px}
.rv-block{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:10px}
.rv-block-hdr{display:flex;align-items:center;gap:7px;padding:9px 13px;border-bottom:1px solid var(--border)}
.rv-block-hdr.night{background:rgba(79,195,247,.07)}
.rv-block-hdr.day{background:rgba(255,167,38,.07)}
.rv-block-hdr-title{font-size:14px;font-weight:700}
.rv-block-hdr.night .rv-block-hdr-title{color:var(--cyan)}
.rv-block-hdr.day .rv-block-hdr-title{color:var(--amber)}
.rv-action-row{display:flex;align-items:flex-start;gap:9px;padding:8px 13px;border-bottom:1px solid var(--border)}
.rv-action-row:last-child{border-bottom:none}
.rv-action-img{width:26px;height:26px;border-radius:6px;object-fit:cover;background:#252540;flex-shrink:0;margin-top:1px}
.rv-action-body{flex:1;min-width:0}
.rv-action-head{font-size:13px;font-weight:600}
.rv-action-player{font-size:11px;color:var(--txt2);margin-bottom:2px}
.rv-note{font-size:12px;line-height:1.5;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.rv-note.from{color:#a78bfa}
.rv-note.to{color:var(--cyan)}
.rv-kill-row{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--border)}
.rv-kill-row:last-child{border-bottom:none}
.rv-kill-body{font-size:13px;flex:1}
.rv-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:5px}
.rv-tag.exec{background:rgba(255,167,38,.15);color:var(--amber)}
.rv-tag.nk{background:rgba(79,195,247,.12);color:var(--cyan)}
.rv-empty{font-size:12px;color:var(--txt2);padding:10px 13px;font-style:italic}
.rv-result{background:var(--card);border-radius:14px;padding:20px;text-align:center;margin-top:4px}
.rv-result-icon{font-size:36px;margin-bottom:8px}
.rv-result-title{font-size:17px;font-weight:800}
.rv-result-msg{font-size:13px;color:var(--txt2);margin-top:6px;white-space:pre-line;line-height:1.7}

/* ══════════════════════════════════════
   MODAL: CHARACTER PICKER
══════════════════════════════════════ */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;
  display:flex;align-items:flex-end}
#modal-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;
  max-height:82vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.modal-handle{width:36px;height:4px;background:#3a3a5a;border-radius:2px;margin:12px auto 8px}
.picker-search{margin:0 14px 10px;padding:10px 14px;border-radius:10px;
  border:1px solid #2a2a4a;background:var(--card2);color:var(--txt);font-size:15px;
  outline:none;-webkit-appearance:none;width:calc(100% - 28px)}
.picker-scroll{flex:1;overflow-y:auto;padding:0 14px 32px}
.picker-team-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--txt2);padding:14px 0 6px}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border);cursor:pointer}
.picker-item:active{opacity:.7}
.picker-item.is-sel{background:rgba(124,77,255,.09);border-radius:12px;padding:10px;margin:0 -10px}
.picker-item.is-used{opacity:.28;pointer-events:none}
.picker-img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#252540;flex-shrink:0}
.picker-info{flex:1;min-width:0}
.picker-cname{font-size:15px;font-weight:600}
.picker-cabil{font-size:11px;color:var(--txt2);margin-top:2px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.picker-check{color:var(--accent);font-size:18px;flex-shrink:0}
.picker-empty{text-align:center;padding:40px;color:var(--txt2);font-size:14px}
</style>
</head>
<body>

<!-- ══════════ SCREEN: UPLOAD ══════════ -->
<div id="screen-upload">
  <div class="up-moon">🌙</div>
  <div class="up-title">说书人助手</div>
  <div class="up-sub">选择剧本，开始主持游戏</div>

<!-- ══════════ MODAL: CHAR PICKER ══════════ -->
<div id="modal-overlay" class="hidden" onclick="overlayClick(event)">

    <div class="modal-handle"></div>

    <div class="picker-scroll" id="picker-scroll"></div>
  </div>

<script>


// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const G = {
  meta: {},
  characters: [],    // assignable (not _meta / fabled / a jinxed)
  charMap: {},       // id → character
  playerCount: 5,
  players: [],       // [{id,seat,name,charId,alive}]
  nightNum: 1,
  nightSteps: [],    // [{player,char,noteFrom,noteTo}] ordered for current night
  nightLog: [],      // [{nightNum, steps:[{charId,charName,playerId,playerName,noteFrom,noteTo}]}]
  step: -1,          // -1 = intro, 0..N-1 = character steps
  phase: 'upload',
  pickerFor: null,   // player.id being assigned
  // Review data
  initialRoles: [],  // snapshot: [{id,seat,name,charId,charName,team}] taken at game start
  dayLog: [],        // [{dayNum, executions:[{id,seat,playerName,charId,charName}]}]
  nightKillLog: [],  // [{nightNum, kills:[{id,seat,playerName,charId,charName}]}]
  gameResult: null,  // {winner,msg} stored when game ends
  demonBluffs: [],   // charIds selected as demon bluffs (up to 3)
};

const TEAMS = {
  townsfolk: { label: '镇民',   cls: 'tt-townsfolk' },
  outsider:  { label: '外来者', cls: 'tt-outsider' },
  minion:    { label: '爪牙',   cls: 'tt-minion' },
  demon:     { label: '恶魔',   cls: 'tt-demon' },
  traveler:  { label: '旅行者', cls: 'tt-traveler' },
};

// ══════════════════════════════════════════════
// JSON PARSING
// ══════════════════════════════════════════════
function parseScriptData(arr) {
  G.meta = arr.find(e => e.id === '_meta') || {};
  G.characters = arr.filter(e =>
    e.id !== '_meta' &&
    e.team !== 'fabled' &&
    e.team !== 'a jinxed' &&
    e.name
  );
  G.charMap = {};
  arr.forEach(c => { if (c.id) G.charMap[c.id] = c; });
}

function parseScript(text) {
  parseScriptData(JSON.parse(text));
}

// ══════════════════════════════════════════════
// SCRIPT LIBRARY — fetch-based
// ══════════════════════════════════════════════
const SCRIPTS_BASE = 'botc_scripts/';

async function loadScriptLibrary() {
  const lib = document.getElementById('script-library');
  lib.innerHTML = '<div style="font-size:13px;color:var(--txt2);text-align:center;padding:12px 0">加载剧本库中…</div>';
  try {
    const res = await fetch(SCRIPTS_BASE + 'manifest.json');
    if (!res.ok) throw new Error('manifest 加载失败');
    const manifest = await res.json();
    renderLibrary(manifest);
  } catch (e) {
    lib.innerHTML = '<div style="font-size:12px;color:var(--txt2);text-align:center;padding:8px 0">剧本库加载失败（需通过 HTTP 访问）</div>';
  }
}

function renderLibrary(manifest) {
  const lib = document.getElementById('script-library');
  if (!manifest.length) { lib.innerHTML = ''; return; }
  lib.innerHTML = manifest.map((item, i) => `
    <button class="up-default" onclick="loadScriptByIndex(${i})" style="margin-bottom:6px">
      <img class="up-default-logo" src="${esc(item.logo||'')}" onerror="this.style.visibility='hidden'" alt="">
      <div class="up-default-info">
        <div class="up-default-name">${esc(item.name)}</div>
        <div class="up-default-by">作者：${esc(item.author||'未知')} · 内置剧本</div>
      </div>
      <span class="up-default-arr">▶</span>
    </button>
  `).join('');
  // store manifest on window for index access
  window._scriptManifest = manifest;
}

async function loadScriptByIndex(i) {
  const item = window._scriptManifest[i];
  if (!item) return;
  try {
    const res = await fetch(SCRIPTS_BASE + item.file);
    if (!res.ok) throw new Error('文件加载失败');
    const data = await res.json();
    parseScriptData(data);
    G.playerCount = 5;
    showScreen('count');
    renderCount();
  } catch (e) {
    alert('剧本加载失败：' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', loadScriptLibrary);

// ══════════════════════════════════════════════
// NIGHT ORDER
// ══════════════════════════════════════════════
function computeNightOrder() {
  const key = G.nightNum === 1 ? 'firstNight' : 'otherNight';
  return G.players
    .filter(p => p.alive && p.charId)
    .map(p => ({ player: p, char: G.charMap[p.charId] }))
    .filter(({ char }) => char && (char[key] || 0) > 0)
    .sort((a, b) => a.char[key] - b.char[key])
    .map(s => ({ ...s, noteFrom: '', noteTo: '', noChoice: false }));
}

// ══════════════════════════════════════════════
// WIN CONDITION
// ══════════════════════════════════════════════
function checkWin() {
  const alive = G.players.filter(p => p.alive);
  const hasDemonEver = G.players.some(p => p.charId && G.charMap[p.charId]?.team === 'demon');
  const aliveDemons = alive.filter(p => p.charId && G.charMap[p.charId]?.team === 'demon');

  if (hasDemonEver && aliveDemons.length === 0)
    return { over: true, winner: 'good', msg: '恶魔已死亡。\n善良阵营获胜！' };

  if (alive.length <= 2)
    return { over: true, winner: 'evil', msg: '场上仅剩两名玩家。\n邪恶阵营获胜！' };

  return { over: false };
}

// ══════════════════════════════════════════════
// SCREEN MANAGEMENT
// ══════════════════════════════════════════════
function showScreen(name) {
  ['upload','count','roles','night','night-summary','day','gameover','review'].forEach(s => {
    document.getElementById(`screen-${s}`).classList.toggle('hidden', s !== name);
  });
  G.phase = name;
}

// ══════════════════════════════════════════════
// UPLOAD SCREEN
// ══════════════════════════════════════════════
document.getElementById('file-in').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      parseScript(ev.target.result);
      G.playerCount = 5;
      showScreen('count');
      renderCount();
    } catch(err) {
      alert('JSON 解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
});

// Drag-and-drop
const upDrop = document.getElementById('up-drop');
upDrop.addEventListener('dragover', e => { e.preventDefault(); upDrop.classList.add('drag'); });
upDrop.addEventListener('dragleave', () => upDrop.classList.remove('drag'));
upDrop.addEventListener('drop', e => {
  e.preventDefault(); upDrop.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { parseScript(ev.target.result); G.playerCount = 5; showScreen('count'); renderCount(); }
    catch(err) { alert('JSON 解析失败：' + err.message); }
  };
  reader.readAsText(file);
});

// ══════════════════════════════════════════════
// COUNT SCREEN
// ══════════════════════════════════════════════
function renderCount() {
  document.getElementById('cnt-game-name').textContent = G.meta.name || '未知剧本';
  const grid = document.getElementById('cnt-grid');
  grid.innerHTML = '';
  for (let n = 5; n <= 15; n++) {
    const btn = document.createElement('button');
    btn.className = 'cnt-btn' + (n === G.playerCount ? ' sel' : '');
    btn.textContent = n;
    btn.onclick = () => {
      G.playerCount = n;
      grid.querySelectorAll('.cnt-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
    };
    grid.appendChild(btn);
  }
}

document.getElementById('cnt-confirm').onclick = () => {
  G.players = Array.from({ length: G.playerCount }, (_, i) => ({
    id: `p${i+1}`, seat: i+1, name: '', charId: null, alive: true,
  }));
  showScreen('roles');
  renderRoles();
};

// ══════════════════════════════════════════════
// ROLES SCREEN
// ══════════════════════════════════════════════
function adjustPlayers(delta) {
  const next = G.playerCount + delta;
  if (next < 5 || next > 15) return;
  if (delta > 0) {
    G.players.push({ id: `p${next}`, seat: next, name: '', charId: null, alive: true });
  } else {
    G.players.pop();
  }
  G.playerCount = next;
  renderRoles();
}

function renderRoles() {
  document.getElementById('roles-game-name').textContent = G.meta.name || '未知剧本';
  const lbl = document.getElementById('roles-count-lbl');
  if (lbl) lbl.textContent = `${G.playerCount} 名玩家`;
  const dec = document.getElementById('roles-dec');
  const inc = document.getElementById('roles-inc');
  if (dec) dec.disabled = G.playerCount <= 5;
  if (inc) inc.disabled = G.playerCount >= 15;
  const list = document.getElementById('roles-list');
  list.innerHTML = '';

  G.players.forEach(player => {
    const char = player.charId ? G.charMap[player.charId] : null;
    const team = char ? TEAMS[char.team] : null;

    const div = document.createElement('div');
    div.className = 'pslot';
    div.innerHTML = `
      <div class="seat-dot">${player.seat}</div>
      <input class="pname-in" placeholder="玩家名（可选）" value="${esc(player.name)}" data-seat="${player.seat}">
      <button class="pick-btn" data-pid="${player.id}">
        ${char
          ? `<img class="pick-btn-img" src="${esc(char.image||'')}" onerror="this.style.visibility='hidden'" alt="">`
          : `<span class="pick-btn-img" style="display:flex;align-items:center;justify-content:center;font-size:14px">＋</span>`
        }
        <span class="pick-btn-name ${char?'':'ph'}">${char ? esc(char.name) : '选择角色'}</span>
        ${team ? `<span class="tt ${team.cls}">${team.label}</span>` : ''}
      </button>
    `;
    list.appendChild(div);

    div.querySelector('.pname-in').addEventListener('input', e => {
      G.players.find(p => p.seat === +e.target.dataset.seat).name = e.target.value;
    });
    div.querySelector('.pick-btn').addEventListener('click', () => {
      G.pickerFor = player.id;
      openPicker();
    });
  });
}

document.getElementById('roles-confirm').onclick = () => {
  const hasDemon = G.players.some(p => p.charId && G.charMap[p.charId]?.team === 'demon');
  if (!hasDemon) { alert('请至少分配一名恶魔角色！'); return; }
  startNight(1);
};

// ══════════════════════════════════════════════
// CHARACTER PICKER MODAL
// ══════════════════════════════════════════════
function openPicker() {
  document.getElementById('picker-search').value = '';
  renderPickerList('');
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('picker-search').focus(), 80);
}

function closePicker() {
  document.getElementById('modal-overlay').classList.add('hidden');
  G.pickerFor = null;
}

function overlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closePicker();
}

document.getElementById('picker-search').addEventListener('input', e =>
  renderPickerList(e.target.value.toLowerCase().trim())
);

function renderPickerList(query) {
  const usedIds = new Set(G.players.filter(p => p.charId).map(p => p.charId));
  const currentId = G.pickerFor ? G.players.find(p => p.id === G.pickerFor)?.charId : null;
  const scroll = document.getElementById('picker-scroll');
  scroll.innerHTML = '';

  const order = ['townsfolk','outsider','minion','demon','traveler'];
  let anyShown = false;

  order.forEach(teamId => {
    const chars = G.characters.filter(c =>
      c.team === teamId &&
      (!query || c.name.includes(query) || (c.ability||'').includes(query))
    );
    if (!chars.length) return;
    anyShown = true;

    const lbl = document.createElement('div');
    lbl.className = 'picker-team-lbl';
    lbl.textContent = TEAMS[teamId]?.label || teamId;
    scroll.appendChild(lbl);

    chars.forEach(char => {
      const isSel = char.id === currentId;
      const isUsed = usedIds.has(char.id) && !isSel;

      const item = document.createElement('div');
      item.className = `picker-item${isSel?' is-sel':''}${isUsed?' is-used':''}`;
      item.innerHTML = `
        <img class="picker-img" src="${esc(char.image||'')}" onerror="this.style.visibility='hidden'" alt="">
        <div class="picker-info">
          <div class="picker-cname">${esc(char.name)}</div>
          <div class="picker-cabil">${esc(char.ability||'')}</div>
        </div>
        ${isSel ? '<span class="picker-check">✓</span>' : ''}
      `;
      item.onclick = () => {
        const player = G.players.find(p => p.id === G.pickerFor);
        if (player) player.charId = isSel ? null : char.id;
        closePicker();
        renderRoles();
      };
      scroll.appendChild(item);
    });
  });

  if (!anyShown) {
    scroll.innerHTML = '<div class="picker-empty">没有匹配的角色</div>';
  }
}

// ══════════════════════════════════════════════
// NIGHT PHASE
// ══════════════════════════════════════════════
function startNight(num) {
  G.nightNum = num;
  G.nightSteps = computeNightOrder();
  G.step = -1;
  // Snapshot initial roles at the very start of the game
  if (num === 1) {
    G.initialRoles = G.players.map(p => {
      const char = p.charId ? G.charMap[p.charId] : null;
      return { id: p.id, seat: p.seat, name: p.name,
               charId: p.charId, charName: char?.name || '', team: char?.team || '' };
    });
  }
  showScreen('night');
  renderNight();
}

function renderNight() {
  document.getElementById('night-num-badge').textContent = `第 ${G.nightNum} 夜`;
  const total = G.nightSteps.length;

  // Step counter
  const ct = document.getElementById('night-step-ct');
  ct.textContent = G.step < 0 ? '准备阶段' : `${G.step + 1} / ${total}`;

  const body = document.getElementById('night-body');
  let html = '';

  if (G.step < 0) {
    // ── Intro ──
    html += `
      <div class="intro-card">
        <div class="intro-icon">🌙</div>
        <div class="intro-title">第 ${G.nightNum} 夜开始</div>
        <div class="intro-text">请告知所有玩家闭上眼睛，夜幕降临。</div>
        ${total > 0
          ? `<div class="intro-count">本夜共 ${total} 位角色行动</div>`
          : `<div class="intro-count" style="color:var(--txt2)">本夜无角色行动</div>`
        }
      </div>
    `;

    if (G.nightNum === 1) {
      const demons  = G.players.filter(p => p.alive && p.charId && G.charMap[p.charId]?.team === 'demon');
      const minions = G.players.filter(p => p.alive && p.charId && G.charMap[p.charId]?.team === 'minion');
      if (demons.length || minions.length) {
        const pTag = p => {
          const ch = G.charMap[p.charId];
          return `<span class="evil-tag">${esc(playerDisplay(p))}<span class="evil-char">·${esc(ch?.name||'')}</span></span>`;
        };
        html += `<div class="nop-card">
          <div class="nop-hdr" style="color:#ff6b8a;letter-spacing:.6px">首夜 · 邪恶阵营互认</div>
          ${demons.length ? `<div class="evil-row">
            <div class="evil-lbl" style="color:var(--demon)">恶魔</div>
            <div class="evil-val">${demons.map(pTag).join('')}</div>
          </div>` : ''}
          ${minions.length ? `<div class="evil-row">
            <div class="evil-lbl" style="color:var(--minion)">爪牙</div>
            <div class="evil-val">${minions.map(pTag).join('')}</div>
          </div>` : ''}
          <div style="padding:8px 14px 10px;font-size:11px;color:var(--txt2);line-height:1.6">
            ${demons.length && minions.length
              ? '向恶魔展示爪牙身份及号码，再向每位爪牙展示恶魔身份及号码。'
              : demons.length ? '本局无爪牙，无需互认。' : '本局无恶魔，无需互认。'}
          </div>
        </div>`;
      }

      // Demon bluffs picker
      const usedIds = new Set(G.players.map(p => p.charId).filter(Boolean));
      const unused = G.characters.filter(c => !usedIds.has(c.id));
      if (unused.length > 0) {
        const bCount = G.demonBluffs.length;
        html += `<div class="nop-card">
          <div class="nop-hdr" style="color:var(--demon);letter-spacing:.6px">首夜 · 恶魔不在场身份</div>
          <div style="padding:6px 14px 2px;font-size:12px;color:var(--txt2);line-height:1.6">
            选择3个未分配角色，展示给恶魔作为可声称的身份
          </div>
          <div class="bluff-count-row">
            <span class="bluff-count" id="bluff-count">已选 ${bCount} / 3</span>
            ${bCount > 0 ? `<button style="font-size:11px;color:var(--txt2);background:none;border:none;cursor:pointer;padding:0" onclick="clearBluffs()">清空</button>` : ''}
          </div>
          <div class="bluff-grid">
            ${unused.map(c => {
              const isSel = G.demonBluffs.includes(c.id);
              const isFull = !isSel && bCount >= 3;
              return `<div class="bluff-item${isSel ? ' sel' : ''}${isFull ? ' bluff-full' : ''}" data-char-id="${esc(c.id)}">
                <img class="bluff-item-img" src="${esc(c.image||'')}" onerror="this.style.visibility='hidden'" alt="">
                <span class="bluff-item-name">${esc(c.name)}</span>
                ${isSel ? `<span class="bluff-ck" style="font-size:9px;color:var(--demon);font-weight:700">✓</span>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }
    }

    if (total > 0) {
      html += `<div class="nop-card">
        <div class="nop-hdr">行动顺序预览</div>
        ${G.nightSteps.map((s, i) => `
          <div class="nop-row">
            <span class="nop-num">${i+1}</span>
            <img class="nop-img" src="${esc(s.char.image||'')}" onerror="this.style.visibility='hidden'" alt="">
            <span class="nop-name">${esc(s.char.name)}</span>
            <span class="nop-player">${playerDisplay(s.player)}</span>
          </div>
        `).join('')}
      </div>`;
    }

    html += `<div class="night-nav">
      <button class="btn ${total>0?'btn-night':'btn-day'}" onclick="nightAction()">
        ${total > 0 ? '开始行动 →' : '跳过，进入白天 →'}
      </button>
    </div>`;

  } else {
    // ── Character step ──
    const s = G.nightSteps[G.step];
    const char = s.char;
    const player = s.player;
    const reminder = G.nightNum === 1
      ? (char.firstNightReminder || '')
      : (char.otherNightReminder || '');
    const team = TEAMS[char.team] || {};
    const isLast = G.step >= total - 1;

    html += `
      <div class="char-card">
        <div class="char-card-hero">
          <img class="char-hero-img" src="${esc(char.image||'')}" onerror="this.style.visibility='hidden'" alt="">
          <div class="char-hero-right">
            <div class="char-hero-name">${esc(char.name)}</div>
            <span class="tt ${team.cls||''}">${team.label||char.team}</span>
            <div class="char-hero-player">👤 ${esc(playerDisplay(player))}</div>
          </div>
        </div>
        ${reminder
          ? `<div class="char-reminder">
               <div class="rem-lbl">主持人提示</div>
               <div class="rem-txt">${esc(reminder)}</div>
             </div>`
          : `<div class="char-reminder" style="color:var(--txt2);font-size:13px;text-align:center">
               （本步骤无特定提示）
             </div>`
        }
        <div class="note-section">
          <div class="note-item">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
              <span class="note-lbl from" style="margin-bottom:0">← 玩家选择 / 告知我</span>
              <label class="no-choice-lbl">
                <input type="checkbox" id="no-choice-cb" ${s.noChoice ? 'checked' : ''} onchange="toggleNoChoice(this.checked)">
                不选择
              </label>
            </div>
            <textarea id="note-from" class="note-ta" placeholder="记录玩家的选择或给出的信息…"
              style="${s.noChoice ? 'display:none' : ''}">${esc(s.noteFrom)}</textarea>
            ${s.noChoice ? '<div class="no-choice-ph">玩家本轮不选择</div>' : ''}
          </div>
          <div class="note-item">
            <label class="note-lbl to">→ 我告知玩家</label>
            <textarea id="note-to" class="note-ta" placeholder="记录我给玩家的信息…">${esc(s.noteTo)}</textarea>
          </div>
        </div>
      </div>
      <div class="night-nav">
        <button class="btn btn-ghost" onclick="nightPrev()">← 上一步</button>
        <button class="btn ${isLast?'btn-day':'btn-night'}" onclick="nightAction()">
          ${isLast ? '结束夜晚 ✓' : '下一步 →'}
        </button>
      </div>
    `;
  }

  // ── Player list ──
  html += renderPlayerList('night');
  body.innerHTML = html;
  body.querySelectorAll('.bluff-item').forEach(el => {
    el.addEventListener('click', () => toggleBluff(el.dataset.charId));
  });
}

// Save whatever is currently in the note textareas before navigating away
function saveCurrentNotes() {
  if (G.step >= 0 && G.step < G.nightSteps.length) {
    const fromEl = document.getElementById('note-from');
    const toEl   = document.getElementById('note-to');
    const cbEl   = document.getElementById('no-choice-cb');
    if (cbEl)   G.nightSteps[G.step].noChoice  = cbEl.checked;
    if (fromEl) G.nightSteps[G.step].noteFrom  = fromEl.value;
    if (toEl)   G.nightSteps[G.step].noteTo    = toEl.value;
  }
}

function toggleBluff(charId) {
  const idx = G.demonBluffs.indexOf(charId);
  if (idx >= 0) {
    G.demonBluffs.splice(idx, 1);
  } else {
    if (G.demonBluffs.length >= 3) return;
    G.demonBluffs.push(charId);
  }
  updateBluffUI();
}

function clearBluffs() {
  G.demonBluffs = [];
  updateBluffUI();
  // re-render to update the "清空" button visibility
  renderNight();
}

function updateBluffUI() {
  const count = G.demonBluffs.length;
  const countEl = document.getElementById('bluff-count');
  if (countEl) countEl.textContent = `已选 ${count} / 3`;
  document.querySelectorAll('.bluff-item').forEach(el => {
    const charId = el.dataset.charId;
    const isSel = G.demonBluffs.includes(charId);
    el.classList.toggle('sel', isSel);
    el.classList.toggle('bluff-full', !isSel && count >= 3);
    // update checkmark
    let ck = el.querySelector('.bluff-ck');
    if (isSel && !ck) {
      ck = document.createElement('span');
      ck.className = 'bluff-ck';
      ck.style.cssText = 'font-size:9px;color:var(--demon);font-weight:700';
      ck.textContent = '✓';
      el.appendChild(ck);
    } else if (!isSel && ck) {
      ck.remove();
    }
  });
  // show/hide "清空" button
  const nb = document.querySelector('.bluff-count-row button');
  if (nb) nb.style.display = count > 0 ? '' : 'none';
}

function toggleNoChoice(checked) {
  if (G.step < 0 || G.step >= G.nightSteps.length) return;
  G.nightSteps[G.step].noChoice = checked;
  const ta = document.getElementById('note-from');
  const ph = document.getElementById('no-choice-ph') ||
    (() => { const d = document.createElement('div'); d.id = 'no-choice-ph'; d.className = 'no-choice-ph'; d.textContent = '玩家本轮不选择'; ta.parentNode.insertBefore(d, ta.nextSibling); return d; })();
  if (ta) ta.style.display = checked ? 'none' : 'block';
  if (ph) ph.style.display = checked ? 'block' : 'none';
}

function nightAction() {
  saveCurrentNotes();
  const total = G.nightSteps.length;
  if (G.step < 0 && total === 0) { endNight(); return; }
  if (G.step >= total - 1) { endNight(); return; }
  G.step++;
  document.getElementById('night-body').scrollTop = 0;
  renderNight();
}

function nightPrev() {
  saveCurrentNotes();
  G.step = Math.max(-1, G.step - 1);
  document.getElementById('night-body').scrollTop = 0;
  renderNight();
}

function endNight() {
  saveCurrentNotes();
  // Archive current night into the permanent log
  G.nightLog.push({
    nightNum: G.nightNum,
    steps: G.nightSteps.map(s => ({
      charId:     s.char.id,
      charName:   s.char.name,
      playerId:   s.player.id,
      playerName: playerDisplay(s.player),
      noteFrom:   s.noteFrom,
      noteTo:     s.noteTo,
    })),
  });
  renderNightSummary();
}

// ══════════════════════════════════════════════
// NIGHT SUMMARY
// ══════════════════════════════════════════════
function renderNightSummary() {
  showScreen('night-summary');
  document.getElementById('sum-badge').textContent = `第 ${G.nightNum} 夜`;

  const total = G.nightSteps.length;
  const withNotes = G.nightSteps.filter(s => s.noteFrom.trim() || s.noteTo.trim()).length;
  document.getElementById('sum-sub').textContent =
    total === 0
      ? '本夜无角色行动。'
      : `共 ${total} 位角色行动，其中 ${withNotes} 条有记录。请核查后进入白天。`;

  const body = document.getElementById('sum-body');

  if (total === 0) {
    body.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--txt2)">本夜无行动记录。</div>`;
    return;
  }

  body.innerHTML = G.nightSteps.map((s, i) => {
    const team = TEAMS[s.char.team] || {};
    const hasFrom = !s.noChoice && s.noteFrom && s.noteFrom.trim();
    const hasTo   = s.noteTo   && s.noteTo.trim();
    const hasAny  = s.noChoice || hasFrom || hasTo;
    return `
      <div class="sum-card">
        <div class="sum-card-hdr">
          <span style="font-size:11px;color:var(--txt2);min-width:18px;flex-shrink:0">${i+1}</span>
          <img class="sum-card-img" src="${esc(s.char.image||'')}" onerror="this.style.visibility='hidden'" alt="">
          <div class="sum-card-info">
            <div class="sum-card-name">${esc(s.char.name)}</div>
            <div class="sum-card-player">
              ${esc(playerDisplay(s.player))}
              <span class="tt ${team.cls||''}" style="margin-left:4px">${team.label||s.char.team}</span>
            </div>
          </div>
          ${!hasAny ? '<span style="font-size:12px;color:var(--txt2);flex-shrink:0">无记录</span>' : ''}
        </div>
        ${hasAny ? `<div class="sum-notes">
          ${s.noChoice ? `<div class="sum-row">
            <span class="sum-arrow" style="color:#a78bfa">←</span>
            <div class="sum-row-body">
              <div class="sum-row-lbl from">玩家选择</div>
              <div class="sum-row-val" style="color:var(--txt2);font-style:italic">不选择</div>
            </div>
          </div>` : (hasFrom ? `<div class="sum-row">
            <span class="sum-arrow" style="color:#a78bfa">←</span>
            <div class="sum-row-body">
              <div class="sum-row-lbl from">玩家告知</div>
              <div class="sum-row-val">${esc(s.noteFrom)}</div>
            </div>
          </div>` : '')}
          ${hasTo ? `<div class="sum-row">
            <span class="sum-arrow" style="color:var(--cyan)">→</span>
            <div class="sum-row-body">
              <div class="sum-row-lbl to">我给出的信息</div>
              <div class="sum-row-val">${esc(s.noteTo)}</div>
            </div>
          </div>` : ''}
        </div>` : ''}
      </div>
    `;
  }).join('');

  window.scrollTo(0, 0);
}

function proceedToDay() {
  G.dayLog.push({ dayNum: G.nightNum, executions: [] });
  showScreen('day');
  renderDay();
}

// ══════════════════════════════════════════════
// DAY PHASE
// ══════════════════════════════════════════════
function renderDay() {
  document.getElementById('day-badge').textContent = `第 ${G.nightNum} 天`;
  document.getElementById('day-sub').textContent = '在此阶段可进行处决。';

  const body = document.getElementById('day-body');
  const nextNight = G.nightNum + 1;
  body.innerHTML = `
    ${renderPlayerList('day')}
    <div style="height:12px"></div>
    <button class="btn btn-ghost" onclick="saveGame()" style="margin-bottom:10px">💾 保存游戏进度</button>
    <button class="btn btn-night" onclick="startNight(${nextNight})">进入第 ${nextNight} 夜 🌙</button>
    <div style="height:32px"></div>
  `;
}

// ══════════════════════════════════════════════
// SHARED: PLAYER LIST RENDER
// ══════════════════════════════════════════════
function renderPlayerList(context) {
  const killLabel = context === 'day' ? '处决' : '死亡';
  const rows = G.players.map(p => {
    const char = p.charId ? G.charMap[p.charId] : null;
    const name = playerDisplay(p);
    return `
      <div class="prow ${p.alive?'':'dead'}">
        ${char
          ? `<img class="prow-img" src="${esc(char.image||'')}" onerror="this.style.visibility='hidden'" alt="">`
          : `<div class="prow-img"></div>`}
        <div class="prow-info">
          <div class="prow-name">${esc(name)}</div>
          <div class="prow-char">${char ? esc(char.name) : '—'}</div>
        </div>
        ${context === 'day'
          ? `${!p.alive ? '<span class="dead-mark" style="margin-right:6px">☠</span>' : ''}
             <button class="kill-btn exec" onclick="killPlayer('${p.id}')">处决</button>`
          : (p.alive
              ? `<button class="kill-btn" onclick="killPlayer('${p.id}')">死亡</button>`
              : `<span class="dead-mark">☠</span>`)}
      </div>
    `;
  }).join('');

  return `<div class="plist">
    <div class="plist-hdr">玩家状态</div>
    ${rows}
  </div>`;
}

// ══════════════════════════════════════════════
// KILL PLAYER
// ══════════════════════════════════════════════
function killPlayer(playerId) {
  const p = G.players.find(pl => pl.id === playerId);
  if (!p) return;
  // During night, skip already-dead players; during day, allow (records execution)
  if (!p.alive && G.phase !== 'day') return;

  const name = playerDisplay(p);
  const charName = p.charId ? (G.charMap[p.charId]?.name || '') : '';
  const label = charName ? `${name}（${charName}）` : name;
  const confirmMsg = p.alive
    ? `确认让 ${label} 死亡？`
    : `${label} 已死亡，仍要记录此次处决？`;

  if (!confirm(confirmMsg)) return;

  const wasAlive = p.alive;
  p.alive = false;

  // Log the kill event
  const rec = { id: p.id, seat: p.seat, playerName: name, charId: p.charId, charName };
  if (G.phase === 'day') {
    const dayEntry = G.dayLog[G.dayLog.length - 1];
    if (dayEntry) dayEntry.executions.push(rec);
  } else {
    let nk = G.nightKillLog.find(e => e.nightNum === G.nightNum);
    if (!nk) { nk = { nightNum: G.nightNum, kills: [] }; G.nightKillLog.push(nk); }
    nk.kills.push(rec);
  }

  // Only check win condition if the player was alive before this action
  if (wasAlive) {
    const result = checkWin();
    if (result.over) {
      // Archive partial night if game ends mid-night
      if (G.phase === 'night' && !G.nightLog.find(e => e.nightNum === G.nightNum)) {
        saveCurrentNotes();
        G.nightLog.push({
          nightNum: G.nightNum,
          steps: G.nightSteps.map(s => ({
            charId: s.char.id, charName: s.char.name,
            playerId: s.player.id, playerName: playerDisplay(s.player),
            noteFrom: s.noteFrom, noteTo: s.noteTo,
          })),
        });
      }
      G.gameResult = result;
      showGameOver(result);
      return;
    }
  }

  // Re-render current screen
  if (G.phase === 'night') renderNight();
  if (G.phase === 'day') renderDay();
}

// ══════════════════════════════════════════════
// GAME OVER
// ══════════════════════════════════════════════
function showGameOver(result) {
  G.gameResult = result;
  showScreen('gameover');
  document.getElementById('go-icon').textContent  = result.winner === 'good' ? '✨' : '💀';
  document.getElementById('go-title').textContent = result.winner === 'good' ? '善良阵营获胜！' : '邪恶阵营获胜！';
  document.getElementById('go-msg').textContent   = result.msg;
}

// ══════════════════════════════════════════════
// SAVE / LOAD
// ══════════════════════════════════════════════
function saveGame() {
  const phaseLabel = G.phase === 'day' ? `第${G.nightNum}天` : `第${G.nightNum}夜`;
  const saveData = {
    saveVersion: 1,
    savedAt: new Date().toISOString(),
    scriptName: G.meta.name || '未知剧本',
    script: {
      meta: G.meta,
      characters: G.characters,
    },
    game: {
      playerCount: G.playerCount,
      players: G.players,
      nightNum: G.nightNum,
      phase: G.phase,
      nightLog: G.nightLog,
      initialRoles: G.initialRoles,
      dayLog: G.dayLog,
      nightKillLog: G.nightKillLog,
      gameResult: G.gameResult,
    },
  };

  const json = JSON.stringify(saveData, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${G.meta.name || '存档'}_${phaseLabel}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function loadSaveFile(text) {
  const data = JSON.parse(text);
  if (!data.saveVersion || !data.script || !data.game)
    throw new Error('不是有效的存档文件');

  G.meta       = data.script.meta || {};
  G.characters = data.script.characters || [];
  G.charMap    = {};
  G.characters.forEach(c => { if (c.id) G.charMap[c.id] = c; });

  G.playerCount  = data.game.playerCount || 5;
  G.players      = data.game.players || [];
  G.nightNum     = data.game.nightNum || 1;
  G.nightLog     = data.game.nightLog || [];
  G.initialRoles = data.game.initialRoles || [];
  G.dayLog       = data.game.dayLog || [];
  G.nightKillLog = data.game.nightKillLog || [];
  G.gameResult   = data.game.gameResult || null;
  G.nightSteps   = [];
  G.step         = -1;
  G.pickerFor    = null;

  const savedPhase = data.game.phase || 'day';
  if (['roles','count','upload'].includes(savedPhase)) {
    showScreen('roles');
    renderRoles();
  } else {
    showScreen('day');
    renderDay();
  }
}

document.getElementById('save-file-in').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { loadSaveFile(ev.target.result); }
    catch(err) { alert('存档加载失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function restartGame() {
  G.meta = {}; G.characters = []; G.charMap = {}; G.players = [];
  G.nightNum = 1; G.nightSteps = []; G.nightLog = []; G.step = -1; G.pickerFor = null;
  G.initialRoles = []; G.dayLog = []; G.nightKillLog = []; G.gameResult = null; G.demonBluffs = [];
  document.getElementById('file-in').value = '';
  showScreen('upload');
}

// ══════════════════════════════════════════════
// REVIEW
// ══════════════════════════════════════════════
function showReview() {
  showScreen('review');
  document.getElementById('rv-sub').textContent =
    (G.meta.name || '未知剧本') + ' · ' + G.players.length + ' 名玩家';

  let html = '';

  // ── Initial role assignments ──
  html += `<div class="rv-sec-lbl">初始角色分配</div>`;
  if (G.initialRoles.length === 0) {
    html += `<div style="font-size:13px;color:var(--txt2);padding:8px 0 12px">
      （从存档恢复的游戏可能缺少此信息）</div>`;
  } else {
    G.initialRoles.forEach(r => {
      const char = r.charId ? G.charMap[r.charId] : null;
      const team = char ? TEAMS[char.team] : null;
      const isDead = !G.players.find(p => p.id === r.id)?.alive;
      html += `<div class="rv-role-row" style="${isDead ? 'opacity:.4' : ''}">
        <span class="rv-role-seat">${r.seat}</span>
        ${char
          ? `<img class="rv-role-img" src="${esc(char.image||'')}" onerror="this.style.visibility='hidden'" alt="">`
          : `<div class="rv-role-img"></div>`}
        <div class="rv-role-info">
          <div class="rv-role-name">${esc(r.name || `座位 ${r.seat}`)}${isDead ? ' ☠' : ''}</div>
          <div class="rv-role-meta">${esc(r.charName || '—')}${team
            ? ` &nbsp;<span class="tt ${team.cls}">${team.label}</span>` : ''}</div>
        </div>
      </div>`;
    });
  }

  // ── Timeline ──
  html += `<div class="rv-sec-lbl" style="margin-top:16px">游戏流程</div>`;

  const allNs = [
    ...G.nightLog.map(e => e.nightNum),
    ...G.dayLog.map(e => e.dayNum),
    ...G.nightKillLog.map(e => e.nightNum),
    G.nightNum,
  ];
  const maxN = Math.max(...allNs, 1);

  for (let n = 1; n <= maxN; n++) {
    const nightEntry  = G.nightLog.find(e => e.nightNum === n);
    const nightKills  = G.nightKillLog.find(e => e.nightNum === n)?.kills || [];
    const dayEntry    = G.dayLog.find(e => e.dayNum === n);

    // Night block
    html += `<div class="rv-block">
      <div class="rv-block-hdr night">
        <span>🌙</span>
        <span class="rv-block-hdr-title">第 ${n} 夜</span>
      </div>`;

    if (!nightEntry || nightEntry.steps.length === 0) {
      if (nightKills.length === 0) {
        html += `<div class="rv-empty">本夜无行动记录</div>`;
      }
    } else {
      nightEntry.steps.forEach(s => {
        const char   = s.charId ? G.charMap[s.charId] : null;
        const hasFrom = s.noteFrom && s.noteFrom.trim();
        const hasTo   = s.noteTo   && s.noteTo.trim();
        html += `<div class="rv-action-row">
          ${char
            ? `<img class="rv-action-img" src="${esc(char.image||'')}" onerror="this.style.visibility='hidden'" alt="">`
            : `<div class="rv-action-img"></div>`}
          <div class="rv-action-body">
            <div class="rv-action-head">${esc(s.charName)}</div>
            <div class="rv-action-player">👤 ${esc(s.playerName)}</div>
            ${hasFrom ? `<div class="rv-note from">← ${esc(s.noteFrom)}</div>` : ''}
            ${hasTo   ? `<div class="rv-note to">→ ${esc(s.noteTo)}</div>`   : ''}
          </div>
        </div>`;
      });
    }

    nightKills.forEach(k => {
      html += `<div class="rv-kill-row">
        <span>💀</span>
        <span class="rv-kill-body">${esc(k.playerName)}${k.charName
          ? `（${esc(k.charName)}）` : ''}<span class="rv-tag nk">夜间</span></span>
      </div>`;
    });

    html += `</div>`;

    // Day block (only if this day actually happened)
    if (dayEntry) {
      html += `<div class="rv-block">
        <div class="rv-block-hdr day">
          <span>☀️</span>
          <span class="rv-block-hdr-title">第 ${n} 天</span>
        </div>`;
      if (dayEntry.executions.length === 0) {
        html += `<div class="rv-empty">本天无处决</div>`;
      } else {
        dayEntry.executions.forEach(k => {
          html += `<div class="rv-kill-row">
            <span>⚖️</span>
            <span class="rv-kill-body">${esc(k.playerName)}${k.charName
              ? `（${esc(k.charName)}）` : ''}<span class="rv-tag exec">处决</span></span>
          </div>`;
        });
      }
      html += `</div>`;
    }
  }

  // Game result
  if (G.gameResult) {
    const r = G.gameResult;
    html += `<div class="rv-result">
      <div class="rv-result-icon">${r.winner === 'good' ? '✨' : '💀'}</div>
      <div class="rv-result-title">${r.winner === 'good' ? '善良阵营获胜！' : '邪恶阵营获胜！'}</div>
      <div class="rv-result-msg">${esc(r.msg)}</div>
    </div>`;
  }

  document.getElementById('review-body').innerHTML = html;
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
function playerDisplay(p) {
  return p.name ? `${p.seat}号 ${p.name}` : `座位 ${p.seat}`;
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
